services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sales-agent-api
    restart: unless-stopped

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./app:/app/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  db:
    image: pgvector/pgvector:pg17

    container_name: sales-agent-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - sales-agent-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sales-agent-db-data: